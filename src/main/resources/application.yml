spring:
  application:
    name: hrflow-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
  jackson:
    time-zone: UTC
server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true
info:
  app:
    name: HRFlow AI
    version: '@project.version@'
hrflow:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:PT1H}
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  tokens:
    verification-ttl: ${EMAIL_VERIFICATION_TTL:PT24H}
    reset-ttl: ${PASSWORD_RESET_TTL:PT30M}
  mail:
    from: ${MAIL_FROM:HRFlow <no-reply@hrflow.local>}
  cv:
    storage-directory: ${CV_STORAGE_DIRECTORY:/tmp/hrflow-cv}
    max-size: ${CV_MAX_SIZE:5242880}
  ai:
    ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model: ${OLLAMA_MODEL:qwen2.5:7b}
    timeout: ${OLLAMA_TIMEOUT:PT2M}
    max-cv-characters: ${AI_MAX_CV_CHARACTERS:30000}
spring.servlet.multipart:
  max-file-size: 6MB
  max-request-size: 6MB
springdoc:
  swagger-ui:
    path: /swagger-ui.html
