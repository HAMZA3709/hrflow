services:
  postgres:
    image: postgres:17-alpine
    container_name: hrflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hrflow_db}
      POSTGRES_USER: ${DB_USERNAME:-hrflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hrflow_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - hrflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrflow -d hrflow_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: hrflow-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - hrflow_mailpit_data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hrflow_postgres_data:
  hrflow_mailpit_data:
